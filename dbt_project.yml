name: 'snowflake_dbt_ecommerce'
version: '1.0.0'
config-version: 2
profile: 'snowflake_dbt_ecommerce'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  high_value_threshold: 20000    # lifetime revenue (INR) for the 'high_value' segment
  medium_value_threshold: 5000   # lifetime revenue (INR) for the 'medium_value' segment

models:
  snowflake_dbt_ecommerce:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

seeds:
  snowflake_dbt_ecommerce:
    +schema: raw
    raw_customers:
      +column_types:
        signup_date: date
    raw_orders:
      +column_types:
        order_date: date
