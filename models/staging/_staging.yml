version: 2

models:
  - name: stg_customers
    description: Cleaned customer records (one row per customer).
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]

  - name: stg_products
    description: Product catalogue (one row per product).
    columns:
      - name: product_id
        tests: [unique, not_null]

  - name: stg_orders
    description: Orders as received from the source system (one row per order).
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: status
        tests:
          - accepted_values:
              values: ['completed', 'shipped', 'cancelled', 'returned']

  - name: stg_order_items
    description: Order line items with a calculated line_total.
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_id
